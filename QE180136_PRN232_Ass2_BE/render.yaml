{
  "services": [
    {
      "name": "tasktrack-api",
      "region": "singapore",
      "plan": "free",
      "dockerfilePath": "./Dockerfile",
      "repo": "https://github.com/YOUR_GITHUB_USERNAME/YOUR_REPO_NAME.git",
      "branch": "main",
      "healthCheckPath": "/",
      "envVars": [
        {
          "key": "ASPNETCORE_ENVIRONMENT",
          "value": "Production"
        },
        {
          "key": "ConnectionStrings__DefaultConnection",
          "sync": false
        }
      ]
    }
  ]
}
