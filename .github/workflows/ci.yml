name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  backend-build:
    name: Backend Build & Test (.NET 8)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore QE180136_PRN232_Ass2_BE/QE180136_PRN232_Ass2_BE.sln

      - name: Build solution
        run: dotnet build QE180136_PRN232_Ass2_BE/QE180136_PRN232_Ass2_BE.sln --no-restore --configuration Release

  frontend-build:
    name: Frontend Build & Lint (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: QE180136_PRN232_Ass2_FE/package-lock.json

      - name: Install dependencies
        working-directory: QE180136_PRN232_Ass2_FE
        run: npm ci

      - name: Lint and build Next.js app
        working-directory: QE180136_PRN232_Ass2_FE
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: https://tasktrack-api.onrender.com
